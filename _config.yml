# Welcome to Jekyll!
title: Deniss Solnce — Resume
url: https://denisolnce.github.io
baseurl:

# Files that must not be published to the site.
# NOTE: setting this replaces Jekyll's default exclude list, so the
# Gemfile / node_modules / vendor entries below must stay.
exclude:
  - LICENSE
  - Taskfile.yml
  - docker-compose.yml
  - Support
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Declared explicitly: without the `github-pages` gem, plugins are no longer
# auto-enabled by it. The :jekyll_plugins bundler group still loads them, but
# this keeps a plain `jekyll build` (no bundler) working too.
plugins:
  - jekyll-feed

# Sass setting
sass:
  sass_dir: _sass
  style:    compressed

# Custom
lang: en                    # html lang
open: true                  # open or close your site
date_format: "%Y-%m-%d"     # date format
theme_color: "#b0dd52"      # your favorite theme color
allow_search_engines: false  # allow search engines indexing your resume
analytics:
  google: G-GHFWPHDLGR
